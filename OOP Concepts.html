
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOP Concepts</title>

<style>
:root{
--bg1:#0f172a;
--bg2:#1e293b;
--card:#1f2937;
--card-hover:#2b3a4f;
--text:#f8fafc;
--muted:#cbd5e1;
--accent:#3b82f6;
--accent-hover:#2563eb;
--green:#22c55e;
--shadow:0 10px 30px rgba(0,0,0,0.25);
--radius:14px;
}

body{
margin:0;
font-family:Segoe UI,Arial;
direction:rtl;
background:linear-gradient(135deg,var(--bg1),var(--bg2));
color:var(--text);
}

.navbar{
background:#020617;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
position:sticky;
top:0;
z-index:10;
}

.navbar a{
color:white;
text-decoration:none;
margin-left:15px;
font-size:14px;
}

.container{
max-width:1000px;
margin:auto;
padding:30px 20px;
}

.search{
margin:20px 0;
text-align:center;
}

.search input{
width:80%;
max-width:500px;
padding:10px;
border-radius:8px;
border:none;
font-size:15px;
}

.card{
background:var(--card);
border-radius:var(--radius);
margin:15px 0;
padding:18px;
box-shadow:var(--shadow);
transition:0.25s;
}

.card:hover{
background:var(--card-hover);
transform:translateY(-2px);
}

.card h3{
margin:0;
display:flex;
align-items:center;
gap:8px;
}

.links a{
display:inline-block;
margin-top:10px;
padding:8px 14px;
background:var(--accent);
color:white;
text-decoration:none;
border-radius:6px;
font-size:13px;
}

.links a:hover{
background:var(--accent-hover);
}

.progress{
margin:30px 0;
background:#020617;
padding:15px;
border-radius:10px;
}

.footer{
text-align:center;
color:#94a3b8;
margin-top:30px;
font-size:13px;
}

</style>

<script>

function searchCards() {
let input=document.getElementById("search").value.toLowerCase()
let cards=document.querySelectorAll(".card")

cards.forEach(card=>{
let text=card.innerText.toLowerCase()
card.style.display=text.includes(input) ? "block" : "none"
})
}

function toggleProgress(id){
localStorage.setItem(id,document.getElementById(id).checked)
}

window.onload=function(){
document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
let val=localStorage.getItem(cb.id)
if(val==="true") cb.checked=true
})
}

</script>

</head>

<body>

<div class="navbar">
<div>AI Roadmap</div>
<div>
<a href="Python Fundamentals.html">Python</a>
<a href="Data Structures.html">Data Structures</a>
<a href="OOP Concepts.html">OOP</a>
<a href="Git and GitHub.html">Git</a>
</div>
</div>

<div class="container">

<h1>OOP Concepts</h1>

<div class="search">
<input id="search" onkeyup="searchCards()" placeholder="ابحث داخل الصفحة...">
</div>

<div class="progress">
<b>Progress Tracker</b><br>
<label><input type="checkbox" id="p1" onclick="toggleProgress('p1')"> بدأت التعلم</label><br>
<label><input type="checkbox" id="p2" onclick="toggleProgress('p2')"> أنهيت الفيديوهات</label><br>
<label><input type="checkbox" id="p3" onclick="toggleProgress('p3')"> أنهيت التمارين</label>
</div>


<div class="card">
<h3>🧱 OOP Concepts Explained</h3>
<div class="links"><a href="https://youtu.be/ZDa-Z5JzLYM" target="_blank">مشاهدة الشرح</a></div>
</div>

<div class="card">
<h3>📚 Head First OOP</h3>
<div class="links"><a href="https://www.oreilly.com/library/view/head-first-object-oriented/9781492077992/" target="_blank">موقع الكتاب</a></div>
</div>


<div class="footer">
AI Engineer Roadmap
</div>

</div>
</body>
</html>
